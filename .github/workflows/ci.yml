name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend Build & Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run mvn clean verify (with Checkstyle)
        working-directory: backend
        run: mvn -B clean verify

  frontend:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci || npm install

      - name: Build (type check + build)
        working-directory: frontend-admin
        run: npm run build
